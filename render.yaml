services:
  - type: web
    name: 3-2-1-futbol
    env: node
    plan: free
    # The squad snapshot is built here, where there is internet and no round
    # waiting on it. It never fails the deploy: without it the server just
    # falls back to live Wikidata lookups.
    buildCommand: npm install && npm run build:squads
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Turns on the production posture: the /debug/* endpoints stop answering
      # unless DEBUG_TOKEN is set and supplied.
      - key: NODE_ENV
        value: production
      # Optional. Set it to reopen /debug/* for yourself:
      #   /debug/lookup?a=Chelsea&b=Liverpool&key=<token>
      - key: DEBUG_TOKEN
        sync: false
      # The canonical address, used for share links, og:url and the manifest.
      # Set this when a custom domain is attached.
      - key: PUBLIC_URL
        sync: false
      # Accounts, stats and the leaderboard. Render's free tier has no
      # persistent disk, so this points at an external Postgres (Neon's free
      # tier is enough). Left unset, the game runs exactly as before with
      # accounts switched off.
      - key: DATABASE_URL
        sync: false
